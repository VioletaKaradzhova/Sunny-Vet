<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Our Doctors - Sunny Vet Clinic</title>
</head>
<body>
<section class="container mt-4 mb-5">
  <div class="d-flex justify-content-between align-items-center mb-5">
    <div>
      <h2 class="text-primary fw-bold mb-1">Meet Our Doctors</h2>
      <p class="text-muted mb-0">Our experienced veterinary professionals are here to help.</p>
    </div>

    <a th:if="${isAdmin}" th:href="@{/doctors/new}" class="btn btn-success fw-bold">+ Add Doctor</a>
  </div>

  <div class="row">
    <div class="col-md-4 mb-4" th:each="doctor : ${doctors}">
      <div class="card shadow-sm border-0 h-100 rounded-4 text-center p-4">
        <div class="card-body">
          <h4 class="card-title text-success fw-bold mb-2" th:text="${doctor.fullName}">Doctor Name</h4>
          <p class="text-muted mb-4">Veterinary Specialist</p>

          <div th:if="${isAuthenticated and !isAdmin}">
            <a th:href="@{/appointments/new}" class="btn btn-outline-primary w-100">Book Appointment</a>
          </div>

          <div th:if="${isAdmin}" class="mt-3 d-flex gap-2 justify-content-center">
            <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}" class="btn btn-sm btn-outline-secondary w-50">Edit</a>
            <form th:action="@{/doctors/delete/{id}(id=${doctor.id})}" method="post" class="m-0 w-50">
              <button type="submit" class="btn btn-sm btn-outline-danger w-100" onclick="return confirm('Are you sure you want to permanently delete this doctor?');">Delete</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(doctors)}" class="alert alert-info text-center py-4 rounded-4">
    No doctors are currently registered in the clinic system.
  </div>
</section>
</body>
</html>
