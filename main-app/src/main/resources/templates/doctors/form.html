<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Doctor - Sunny Vet Clinic</title>
</head>
<body>
<section class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 p-4 rounded-4">
                <h3 class="mb-4 text-success fw-bold" th:text="${doctor.id == null ? 'Add New Doctor' : 'Edit Doctor'}"></h3>
                <form th:action="${doctor.id == null ? '/doctors' : '/doctors/edit/' + doctor.id}" th:object="${doctor}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" required autofocus />
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/doctors}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success px-4" th:text="${doctor.id == null ? 'Add Doctor' : 'Update Doctor'}"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
