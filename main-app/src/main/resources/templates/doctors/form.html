<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Doctor - Sunny Vet Clinic</title>
</head>
<body>
<section class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 p-4 rounded-4">
                <h3 class="mb-4 text-success fw-bold" th:text="${doctorForm.id == null ? 'Register New Doctor' : 'Edit Doctor Profile'}"></h3>

                <form th:action="${doctorForm.id == null ? '/doctors/new' : '/doctors/edit/' + doctorForm.id}" th:object="${doctorForm}" method="post">

                    <h5 class="text-primary fw-bold border-bottom pb-2 mb-3">Professional Details</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Full Name (with Title)</label>
                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Dr. Sarah Smith" required autofocus />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Specialization</label>
                            <input type="text" th:field="*{specialization}" class="form-control" placeholder="e.g. Feline Surgery" required />
                        </div>
                    </div>

                    <h5 class="text-primary fw-bold border-bottom pb-2 mt-4 mb-3">Account & Contact Details</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">System Username</label>
                            <input type="text" th:field="*{username}" class="form-control" required />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" required />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Phone Number</label>
                            <input type="text" th:field="*{phoneNumber}" class="form-control" required />
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" th:placeholder="${doctorForm.id == null ? 'Required' : 'Leave blank to keep current'}" th:required="${doctorForm.id == null}" />
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4 border-top pt-4">
                        <a th:href="@{/dashboard}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-success px-5" th:text="${doctorForm.id == null ? 'Add Doctor' : 'Update Doctor'}"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
