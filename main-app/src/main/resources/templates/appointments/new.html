<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Appointment - Sunny Vet Clinic</title>
</head>
<body>
<section class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 mt-4 mb-5">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0">Book a New Appointment</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/appointments}" th:object="${appointment}" method="post">

                        <div class="mb-3">
                            <label for="appointmentTime" class="form-label fw-bold">Date & Time</label>
                            <input type="datetime-local" id="appointmentTime" th:field="*{appointmentTime}" class="form-control" required />
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="reason" class="form-label fw-bold">Reason for Visit</label>
                            <textarea id="reason" th:field="*{reason}" class="form-control" rows="3" placeholder="Please describe the symptoms or reason for the visit..." required></textarea>
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="doctorId" class="form-label fw-bold">Doctor</label>
                                <select id="doctorId" th:field="*{doctorId}" class="form-select" required>
                                    <option value="" disabled selected>Select a Doctor...</option>
                                    <option th:each="doctor : ${doctors}" th:value="${doctor.id}" th:text="${doctor.fullName}"></option>
                                </select>
                                <div class="text-danger mt-1" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></div>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label for="petId" class="form-label fw-bold">Pet</label>
                                <select id="petId" th:field="*{petId}" class="form-select" required>
                                    <option value="" disabled selected>Select a Pet...</option>
                                    <option th:each="pet : ${pets}" th:value="${pet.id}" th:text="${pet.name}"></option>
                                </select>
                                <div class="text-danger mt-1" th:if="${#fields.hasErrors('petId')}" th:errors="*{petId}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <a th:href="@{/appointments}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success px-4">Book Appointment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
