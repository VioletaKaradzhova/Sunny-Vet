<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Appointment - Sunny Vet Clinic</title>
</head>
<body>
<section class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 mt-4 mb-5">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Book a New Appointment</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/appointments}" method="post" th:object="${appointment}">
                        <div class="mb-3">
                            <label for="appointmentTime" class="form-label">Date & Time</label>
                            <input type="datetime-local" id="appointmentTime" th:field="*{appointmentTime}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="reason" class="form-label">Reason for Visit</label>
                            <textarea id="reason" th:field="*{reason}" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="doctorId" class="form-label">Doctor ID</label>
                            <input type="text" id="doctorId" th:field="*{doctorId}" class="form-control" placeholder="Enter Doctor UUID" required />
                        </div>
                        <div class="mb-4">
                            <label for="petId" class="form-label">Pet ID</label>
                            <input type="text" id="petId" th:field="*{petId}" class="form-control" placeholder="Enter Pet UUID" required />
                        </div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/appointments}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Book Appointment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
