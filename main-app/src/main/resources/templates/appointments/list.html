<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments - Sunny Vet Clinic</title>
</head>
<body>
<section class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Appointments</h2>
        <a th:href="@{/appointments/new}" class="btn btn-success">Book Appointment</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Date & Time</th>
                    <th>Reason</th>
                    <th>Doctor</th>
                    <th>Pet</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appt : ${appointments}">
                    <td class="fw-bold" th:text="${#temporals.format(appt.appointmentTime, 'dd-MM-yyyy HH:mm')}"></td>
                    <td th:text="${appt.reason}"></td>
                    <td>
                        <a th:href="@{/doctors/{id}(id=${appt.doctorId})}" th:text="${appt.doctorName}" class="text-decoration-none fw-bold"></a>
                    </td>
                    <td>
                        <a th:href="@{/pets/{id}(id=${appt.petId})}" th:text="${appt.petName}" class="text-decoration-none fw-bold"></a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(appointments)}" class="alert alert-info mb-0">
                No appointments scheduled.
            </div>
        </div>
    </div>
</section>
</body>
</html>
