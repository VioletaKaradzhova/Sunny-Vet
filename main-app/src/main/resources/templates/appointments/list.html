<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments - Sunny Vet Clinic</title>
</head>
<body>
<section class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Appointments</h2>
        <a th:href="@{/appointments/new}" class="btn btn-success">Book Appointment</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Date & Time</th>
                    <th>Reason</th>
                    <th>Doctor ID</th>
                    <th>Pet ID</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appt : ${appointments}">
                    <td class="fw-bold" th:text="${appt.appointmentTime}">Date</td>
                    <td th:text="${appt.reason}">Reason</td>
                    <td th:text="${appt.doctorId}">Doctor ID</td>
                    <td th:text="${appt.petId}">Pet ID</td>
                </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(appointments)}" class="alert alert-info mb-0">
                No appointments scheduled.
            </div>
        </div>
    </div>
</section>
</body>
</html>
