<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registered Pets - SunnyVet Clinic')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>Registered Pets</h1>
    <a th:href="@{/pets/new}">Register New Pet</a>
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Species</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pet : ${pets}">
            <td th:text="${pet.name}"></td>
            <td th:text="${pet.species}"></td>
            <td th:text="${pet.age}"></td>
            <td>
                <a th:href="@{/pets/{id}(id=${pet.id})}">View Details</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
