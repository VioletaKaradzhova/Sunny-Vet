<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Pets - SunnyVet Clinic</title>
</head>
<body>
<header>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/pets}">Pets</a>
    </nav>
</header>
<main>
    <h1>Registered Pets</h1>
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Species</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pet : ${pets}">
            <td th:text="${pet.name}"></td>
            <td th:text="${pet.species}"></td>
            <td th:text="${pet.age}"></td>
            <td>
                <a th:href="@{/pets/{id}(id=${pet.id})}">View Details</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
