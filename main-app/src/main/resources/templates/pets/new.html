<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Pet - Sunny Vet Clinic</title>
</head>
<body>
<section class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 mt-4 mb-5">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0">Register a New Pet</h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="@{/pets}" th:object="${pet}" method="post">

                        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.detailedErrors()}" th:text="${err.fieldName + ': ' + err.message}"></li>
                            </ul>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Pet Name</label>
                            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g., Bella" required />
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="species" class="form-label fw-bold">Species</label>
                            <input type="text" id="species" th:field="*{species}" class="form-control" placeholder="e.g., Dog, Cat, Rabbit" required />
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('species')}" th:errors="*{species}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="age" class="form-label fw-bold">Age (Years)</label>
                            <input type="number" id="age" th:field="*{age}" class="form-control" min="0" max="30" required />
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <a th:href="@{/pets}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success px-4">Register Pet</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
