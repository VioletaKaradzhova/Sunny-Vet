<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register Pet - SunnyVet Clinic')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>Register a New Pet</h1>
    <form th:action="@{/pets}" th:object="${pet}" method="post">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>
        <div>
            <label for="species">Species:</label>
            <input type="text" id="species" th:field="*{species}" required>
        </div>
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" th:field="*{age}" required>
        </div>
        <div>
            <label for="ownerId">Owner ID:</label>
            <input type="text" id="ownerId" th:field="*{ownerId}" required>
        </div>
        <button type="submit">Save</button>
    </form>
</main>
</body>
</html>
