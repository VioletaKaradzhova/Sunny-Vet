<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Pet Details - Sunny Vet Clinic</title>
</head>
<body>
<section class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow border-0 rounded-4 text-center p-5">
        <h1 class="display-4 text-success fw-bold mb-2" th:text="${pet.name}">Pet Name</h1>
        <h4 class="text-muted mb-4" th:text="${pet.species}">Species</h4>

        <div class="bg-light rounded-4 p-4 mb-5">
          <h5 class="mb-0 text-dark">Age: <span class="text-primary fw-bold" th:text="${pet.age} + ' years old'"></span></h5>
        </div>

        <div class="d-flex justify-content-center gap-3">
          <a th:href="@{/appointments}" class="btn btn-outline-primary px-4">Back to Appointments</a>
          <a th:href="@{/pets/{id}/treatments(id=${pet.id})}" class="btn btn-success px-4">View Treatments</a>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
