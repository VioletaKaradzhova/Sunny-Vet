<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Pet Details - Sunny Vet Clinic</title>
</head>
<body>
<section class="container">
  <div class="mb-4">
    <a th:href="@{/pets}" class="btn btn-outline-secondary">&larr; Back to Pets</a>
  </div>

  <div class="card shadow-sm border-0" th:if="${pet != null}">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0" th:text="${pet.name}">Pet Name</h4>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <ul class="list-group list-group-flush">
            <li class="list-group-item"><strong>Species:</strong> <span th:text="${pet.species}"></span></li>
            <li class="list-group-item"><strong>Age:</strong> <span th:text="${pet.age}"></span> years</li>
          </ul>
        </div>
        <div class="col-md-6 mt-3 mt-md-0">
          <a th:href="@{/treatments/pet/{id}(id=${pet.id})}" class="btn btn-success w-100 mb-2">View Treatments</a>
          <a th:href="@{/appointments/new}" class="btn btn-outline-primary w-100">Book Appointment</a>
        </div>
      </div>
    </div>
  </div>

  <div class="alert alert-danger" th:if="${pet == null}">
    Pet not found.
  </div>
</section>
</body>
</html>
