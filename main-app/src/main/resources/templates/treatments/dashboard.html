<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Treatment Dashboard - Sunny Vet Clinic</title>
</head>
<body>
<section class="container">
  <h2 class="mb-4 text-primary">Treatment Dashboard</h2>

  <div class="row mb-4">
    <div class="col-md-12">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Clinic Treatment Statistics</h5>
        </div>
        <div class="card-body">
          <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="stat : ${stats}">
              <span class="fw-bold" th:text="${stat.key}"></span>
              <span class="badge bg-primary rounded-pill" th:text="${stat.value}"></span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div class="card shadow-sm border-0 mb-4 h-100">
        <div class="card-header bg-white">
          <h5 class="mb-0">Record New Treatment</h5>
        </div>
        <div class="card-body">
          <form th:action="@{/treatments/new}" method="post">
            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" class="form-control" name="description" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Cost ($)</label>
              <input type="number" step="0.01" class="form-control" name="cost" required />
            </div>
            <button type="submit" class="btn btn-success">Record Treatment</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm border-0 mb-4 h-100">
        <div class="card-header bg-white">
          <h5 class="mb-0">Update Existing Treatment</h5>
        </div>
        <div class="card-body">
          <form th:action="@{/treatments/update}" method="post">
            <div class="mb-3">
              <label class="form-label">Treatment ID (UUID)</label>
              <input type="text" class="form-control" name="id" required />
            </div>
            <div class="mb-3">
              <label class="form-label">New Description</label>
              <input type="text" class="form-control" name="description" required />
            </div>
            <div class="mb-3">
              <label class="form-label">New Cost ($)</label>
              <input type="number" step="0.01" class="form-control" name="cost" required />
            </div>
            <button type="submit" class="btn btn-warning">Update Treatment</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
