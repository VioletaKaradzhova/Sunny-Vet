<!DOCTYPE html>
<html th:fragment="layout(title, content)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Sunny Vet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        section[id] { scroll-margin-top: 2rem; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Sunny Vet Clinic</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">

                <li class="nav-item" th:if="${!isAuthenticated or isClientUser}">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item" th:if="${isAuthenticated and !isClientUser}">
                    <a class="nav-link" th:href="@{/}">Dashboard</a>
                </li>

                <li class="nav-item" th:if="${!isAuthenticated}">
                    <a class="nav-link" th:href="@{/#about}">About Us</a>
                </li>

                <li class="nav-item" th:if="${isAuthenticated and isClientUser}">
                    <a class="nav-link" th:href="@{/pets}">My Pets</a>
                </li>
                <li class="nav-item" th:if="${isAuthenticated and !isClientUser}">
                    <a class="nav-link" th:href="@{/pets}">Pets</a>
                </li>

                <li class="nav-item" th:if="${isAuthenticated and isClientUser}">
                    <a class="nav-link" th:href="@{/appointments}">My Appointments</a>
                </li>
                <li class="nav-item" th:if="${isAuthenticated and !isClientUser}">
                    <a class="nav-link" th:href="@{/appointments}">Appointments</a>
                </li>

                <li class="nav-item" th:if="${!isAuthenticated or isClientUser}">
                    <a class="nav-link" th:href="@{/#doctors}">Doctors</a>
                </li>

            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${!isAuthenticated}">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item" th:if="${!isAuthenticated}">
                    <a class="nav-link" th:href="@{/register}">Sign Up</a>
                </li>

                <li class="nav-item dropdown" th:if="${isAuthenticated}">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" th:text="${username}">Account</a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                <button class="dropdown-item text-danger" type="submit">Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
<main th:replace="${content}"></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
