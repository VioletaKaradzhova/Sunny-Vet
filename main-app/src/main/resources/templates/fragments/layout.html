<!DOCTYPE html>
<html th:fragment="layout(title, content)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Sunny Vet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        section[id] { scroll-margin-top: 2rem; }

        body {
            background-color: #fdfbf7 !important;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ecdcc2' fill-opacity='0.4' fill-rule='evenodd'%3E%3Cpath d='M25 15c-1.6 0-3 1.3-3 3s1.4 3 3 3 3-1.3 3-3-1.4-3-3-3zm-7 3c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm14 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-7-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z'/%3E%3Cpath d='M25 29c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6z'/%3E%3Cg transform='translate(30, 30)'%3E%3Cpath d='M25 15c-1.6 0-3 1.3-3 3s1.4 3 3 3 3-1.3 3-3-1.4-3-3-3zm-7 3c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm14 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-7-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z'/%3E%3Cpath d='M25 29c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") !important;
        }

        {
            background-color: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Sunny Vet Clinic</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">

                <li class="nav-item" th:if="${!isAuthenticated or isClientUser}">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item" th:if="${isAuthenticated and !isClientUser}">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>

                <li class="nav-item" th:if="${!isAuthenticated}">
                    <a class="nav-link" th:href="@{/#about}">About Us</a>
                </li>

                <li class="nav-item" th:if="${isAuthenticated and isClientUser}">
                    <a class="nav-link" th:href="@{/pets}">My Pets</a>
                </li>
                <li class="nav-item" th:if="${isAuthenticated and !isClientUser}">
                    <a class="nav-link" th:href="@{/pets}">Pets</a>
                </li>

                <li class="nav-item" th:if="${isAuthenticated and isClientUser}">
                    <a class="nav-link" th:href="@{/appointments}">My Appointments</a>
                </li>
                <li class="nav-item" th:if="${isAuthenticated and !isClientUser}">
                    <a class="nav-link" th:href="@{/appointments}">Appointments</a>
                </li>

                <li class="nav-item" th:if="${!isAuthenticated or isClientUser}">
                    <a class="nav-link" th:href="@{/#doctors}">Doctors</a>
                </li>

            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${!isAuthenticated}">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item" th:if="${!isAuthenticated}">
                    <a class="nav-link" th:href="@{/register}">Sign Up</a>
                </li>

                <li class="nav-item dropdown" th:if="${isAuthenticated}">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" th:text="${username}">Account</a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}">My Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                <button class="dropdown-item text-danger" type="submit">Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
<main th:replace="${content}"></main>

<footer class="bg-primary text-white text-center py-4 mt-auto shadow-lg">
    <div class="container">
        <p class="mb-1 fw-bold">&copy; 2026 Sunny Vet Clinic. All rights reserved.</p>
        <p class="mb-0 small text-white-50">Providing compassionate, expert care for your furry family members.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
